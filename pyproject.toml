[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loom-affinity2ui"
version = "0.1.1"
description = "Read-only Affinity to LayaAir UI export, optimization and shared resource workflow"
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-Proprietary"
dependencies = ["loom-image9grid==1.1.0", "Pillow>=10.3,<14", "numpy>=1.26,<3"]

[project.optional-dependencies]
dev = ["build>=1.2", "twine>=6"]

[project.scripts]
affinity2ui = "affinity2ui.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["affinity2ui*"]
namespaces = false

[tool.setuptools.package-data]
affinity2ui = ["*.js", "*.mjs", "*.json", "runtime/*.ts", "runtime/*.json", "templates/*.toml"]
